events {
    worker_connections 1024;
}

http {
    # DNS resolver bawaan Docker Compose.
    # Memperbarui alamat IP container ketika replica berubah/dibuat ulang.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format upstreamlog
    '$time_local status=$status upstream=$upstream_addr';
    
    access_log /dev/stdout upstreamlog;

    # Backend Streamlit. ml-ui adalah nama service di docker-compose.yml.
    upstream streamlit_servers {
        zone streamlit_servers 64k;
        # Metode default Nginx: round-robin.
        server ml-ui:8501 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://streamlit_servers;

            # Header informasi client.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Dukungan WebSocket Streamlit.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout koneksi.
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}
